version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: b3-challenge-postgres
    environment:
      POSTGRES_DB: b3_challenge
      POSTGRES_USER: b3user
      POSTGRES_PASSWORD: b3password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - b3-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b3user -d b3_challenge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # B3 Challenge API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b3-challenge-api
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: b3user
      DB_PASSWORD: b3password
      DB_NAME: b3_challenge
      DB_SSL_MODE: disable
      
      # API Configuration
      API_PORT: 8080
      API_HOST: 0.0.0.0
      GIN_MODE: release
      
      # Logging
      LOG_LEVEL: info
      LOG_FORMAT: json
      
      # Performance
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5
      DB_CONN_MAX_LIFETIME: 300s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - b3-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Data Loader (runs once to populate initial data)
  data-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b3-challenge-data-loader
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: b3user
      DB_PASSWORD: b3password
      DB_NAME: b3_challenge
      DB_SSL_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - b3-network
    restart: "no"  # Run once only

  # Redis (for future caching implementation)
  redis:
    image: redis:7-alpine
    container_name: b3-challenge-redis
    ports:
      - "6379:6379"
    networks:
      - b3-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - cache  # Optional service, enable with --profile cache

  # Nginx Load Balancer (for production scaling)
  nginx:
    image: nginx:alpine
    container_name: b3-challenge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - b3-network
    restart: unless-stopped
    profiles:
      - production  # Optional service for production

  # Prometheus (for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: b3-challenge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - b3-network
    restart: unless-stopped
    profiles:
      - monitoring  # Optional service for monitoring

  # Grafana (for dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: b3-challenge-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - b3-network
    restart: unless-stopped
    profiles:
      - monitoring  # Optional service for monitoring

networks:
  b3-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

